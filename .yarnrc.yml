# Yarn 4 Plug'n'Play（2026-11 从 pnpm 迁移，参照 obsidian-my-obsidian 的做法）
nodeLinker: pnp

# 包 cache 落全局目录（不进仓），与 obsidian-my-obsidian 共用
enableGlobalCache: true
globalFolder: E:/HOME/Code/.yarn-global

# 允许带构建脚本的包执行 install 脚本（esbuild 等，默认 true，显式声明）
enableScripts: true

# unplugged 放项目外面，且用本项目独立子目录：yarn install 会按本项目
# lockfile 清理 pnpUnpluggedFolder 里「不属于本项目」的条目，多项目共用
# 一个目录会互相删掉对方的解包内容（2026-11-08 在 virtual-tree 上踩过）。
pnpUnpluggedFolder: E:/HOME/Code/.yarn-global/unplugged-siyuan-plugin-browser
